[package]
name = "etracker"
version = "0.1.0"
description = "A local-first personal financial management application"
authors = ["AlvinLionel"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "etracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "serialize"] }
uuid = { version = "1.29.0", features = ["v4"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csv = "1.4.0"
calamine = { version = "0.38.0", features = ["chrono"] }
sha2 = "0.10.9"
pdf-extract = "0.12.1"

[dev-dependencies]
lopdf = { version = "0.42.0", default-features = false }
zip = { version = "9.4.1", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
