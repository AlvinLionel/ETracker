name: Build Windows installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installers:
    name: Build signed Windows x64 packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Strawberry Perl for vendored SQLCipher
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'
          $env:PATH = 'C:\Strawberry\perl\bin;' + $env:PATH
          perl -MLocale::Maketext::Simple -e "print 'Perl build dependency ready'"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installers and stage release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles msi,nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('ETracker {0}', github.ref_name) || '' }}
          releaseBody: "ETracker Windows x64 installers and signed updater files. Review this draft before publishing it."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
