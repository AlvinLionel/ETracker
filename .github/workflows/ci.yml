name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    name: Verify on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Strawberry Perl for vendored SQLCipher
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Strawberry\perl\bin'
          $env:PATH = 'C:\Strawberry\perl\bin;' + $env:PATH
          perl -MLocale::Maketext::Simple -e "print 'Perl build dependency ready'"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
